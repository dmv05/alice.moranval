<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription Stage — Alice Moranval-Vincent</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8f7f4; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
header { background: #fff; border-bottom: 2px solid #111; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: #111; text-decoration: none; }
.logo span { color: #2563EB; }
.back { font-size: 11px; font-weight: 700; color: #888; text-decoration: none; letter-spacing: 1.5px; text-transform: uppercase; }
.back:hover { color: #111; }
main { flex: 1; max-width: 560px; margin: 0 auto; width: 100%; padding: 40px 24px; }
.pre { font-size: 10px; font-weight: 800; letter-spacing: 3px; color: #2563EB; text-transform: uppercase; margin-bottom: 6px; }
h1 { font-size: clamp(24px, 5vw, 32px); font-weight: 900; letter-spacing: -1px; color: #111; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 32px; }
.form-card { background: #fff; border-radius: 10px; border: 1px solid #e5e3de; padding: 28px 24px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 11px; font-weight: 800; color: #111; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e5e3de; border-radius: 6px; font-size: 14px; font-family: inherit; color: #111; background: #f8f7f4; transition: border-color 0.15s; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #2563EB; background: #fff; }
.field textarea { resize: vertical; min-height: 90px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.divider { border: none; border-top: 1px solid #e5e3de; margin: 22px 0; }
.btn-submit { display: block; width: 100%; padding: 14px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 24px; transition: background 0.15s; }
.btn-submit:hover { background: #2563EB; }
.notice { font-size: 11px; color: #aaa; text-align: center; margin-top: 14px; line-height: 1.5; }
footer { text-align: center; padding: 20px; font-size: 11px; color: #bbb; letter-spacing: 0.5px; }
@media (max-width: 480px) { .row { grid-template-columns: 1fr; } main { padding: 28px 16px; } .form-card { padding: 20px 16px; } }
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo">AM<span>V</span></a>
  <a href="stages.html" class="back">← Stages</a>
</header>
<main>
  <div class="pre">Stage équestre</div>
  <h1>Inscription</h1>
  <p class="subtitle">Remplissez le formulaire ci-dessous — Alice et Emma vous répondront rapidement.</p>
  <div class="form-card">
    <form id="form">
      <div class="row">
        <div class="field"><label for="prenom">Prénom</label><input type="text" id="prenom" name="prenom" required placeholder="Marie"></div>
        <div class="field"><label for="nom">Nom</label><input type="text" id="nom" name="nom" required placeholder="Dupont"></div>
      </div>
      <div class="row">
        <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required placeholder="marie@exemple.com"></div>
        <div class="field"><label for="tel">Téléphone</label><input type="tel" id="tel" name="tel" placeholder="06 00 00 00 00"></div>
      </div>
      <hr class="divider">
      <div class="row">
        <div class="field"><label for="cheval">Nom du cheval</label><input type="text" id="cheval" name="cheval" placeholder="Tornado"></div>
        <div class="field">
          <label for="niveau">Niveau CSO</label>
          <select id="niveau" name="niveau">
            <option value="">— Choisir —</option>
            <option>Débutant (80cm)</option>
            <option>Club (90–100cm)</option>
            <option>Amateur (1m–1m10)</option>
            <option>1m15 – 1m20</option>
            <option>1m25 – 1m30</option>
            <option>1m35 et +</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="message">Message (questions, dates souhaitées…)</label>
        <textarea id="message" name="message" placeholder="Je souhaite participer au stage de juillet…"></textarea>
      </div>
      <button type="submit" class="btn-submit">Envoyer ma demande</button>
      <p class="notice">Votre messagerie va s'ouvrir avec les informations pré-remplies.<br>Cliquez simplement sur Envoyer.</p>
    </form>
  </div>
</main>
<footer>alice.moranval.com</footer>
<script>
document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  var prenom  = document.getElementById('prenom').value.trim();
  var nom     = document.getElementById('nom').value.trim();
  var email   = document.getElementById('email').value.trim();
  var tel     = document.getElementById('tel').value.trim();
  var cheval  = document.getElementById('cheval').value.trim();
  var niveau  = document.getElementById('niveau').value;
  var message = document.getElementById('message').value.trim();
  var sujet = 'Inscription stage — ' + prenom + ' ' + nom;
  var corps =
    'Bonjour Alice et Emma,\n\n' +
    'Je souhaite m\'inscrire à un stage équestre.\n\n' +
    '— COORDONNÉES —\n' +
    'Prénom : ' + prenom + '\nNom : ' + nom + '\nEmail : ' + email + '\nTéléphone : ' + (tel || 'non renseigné') + '\n\n' +
    '— CHEVAL —\n' +
    'Nom du cheval : ' + (cheval || 'non renseigné') + '\nNiveau CSO : ' + (niveau || 'non renseigné') + '\n\n' +
    '— MESSAGE —\n' + (message || 'Aucun message.') + '\n\nCordialement,\n' + prenom + ' ' + nom;
  window.location.href =
    'mailto:alice.moranval@gmail.com,emma@moranval.com' +
    '?subject=' + encodeURIComponent(sujet) +
    '&body=' + encodeURIComponent(corps);
});
</script>
</body>
</html>
